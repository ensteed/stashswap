<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 – Lost in the Stash</title>
  <link rel="stylesheet" href="{{attr:client_css}}">
</head>
<body>
  <div class="not-found-page">
    <div class="not-found-card">
      <span class="not-found-yarn">🧶</span>
      <div class="not-found-code">404</div>
      <h1>This skein has gone missing.</h1>
      <p>We've searched every basket, bag, and suspicious pile on the floor — this page isn't in the stash.</p>
      <div class="not-found-actions">
        <a href="/" class="btn btn-primary">Take me home</a>
        <a href="javascript:history.back()" class="btn btn-ghost">← Go back</a>
      </div>
      <p class="not-found-url">{{url}}</p>
    </div>
  </div>
</body>
</html>
